<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background (optional) -->
  <rect width="512" height="512" rx="100" fill="#0a192f" />
  
  <!-- Medical Cross -->
  <rect x="170" y="100" width="172" height="312" rx="30" fill="#2ecc71" />
  <rect x="100" y="170" width="312" height="172" rx="30" fill="#2ecc71" />
  
  <!-- EKG Line through the cross -->
  <path d="M120 256 L200 256 L220 180 L240 320 L260 200 L280 280 L310 256 L380 256" 
    stroke="#1a5276" 
    stroke-width="8" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none" />
  
  <!-- Glow effect for dark mode -->
  <circle cx="256" cy="256" r="200" fill="#2ecc71" opacity="0.05" />
</svg>